name: release
# `vX.Y.Z` etiketi gönderilince: paket derlenir, PyPI'a yayımlanır (Trusted Publishing, token yok), GitHub Release açılır.
# Ön koşul (bir kez): PyPI'da proje için "trusted publisher" tanımı: owner MatriksData, repo matriks-pii,
# workflow release.yml, environment pypi. GitHub'da "pypi" ortamı (Settings → Environments), isteğe bağlı onaycıyla.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: etiket = pyproject sürümü
        run: |
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$VER" = "$GITHUB_REF_NAME" || { echo "etiket $GITHUB_REF_NAME, pyproject $VER"; exit 1; }
      # yayından önce testler (etiketlenen commit CI'dan geçmemiş olabilir)
      - run: pip install -e ".[dev,fast,metrics,redis]" "litellm[proxy]==1.106.5"
      - run: ruff check matriks_pii scripts tests && mypy matriks_pii --ignore-missing-imports
      - run: pytest -q && python scripts/corpus_report.py
        env:
          PYTHONUTF8: "1"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: wheel kurulum denemesi
        run: |
          pip install dist/*.whl
          cd /tmp && matriks-pii --version && matriks-pii mask "Ben Ayşe Demir, TCKN 17291716060" | grep -q "<TCKN_1>"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/matriks-mask
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - name: CHANGELOG bölümünden sürüm notu
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '$0 ~ "^## "v" " {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "matriks-pii $VER" > notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "matriks-pii ${GITHUB_REF_NAME#v}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
