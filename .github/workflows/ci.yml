name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        litellm: ["litellm[proxy]==1.106.1", "litellm[proxy]==1.106.5", "litellm[proxy]>=1.106.1,<2"]
        include:
          # geliştirme Windows'ta yapılıyor: PYTHONUTF8 / yol / satır sonu gerilemeleri
          - os: windows-latest
            python: "3.12"
            litellm: "litellm[proxy]==1.106.5"
    env:
      PYTHONUTF8: "1"
      # Gerçek sır değildir: yalnız testlerde examples/config.strict.yaml'ın selftest'i için kullanılan sabit örnek değer.
      MATRIKS_PII_HASH_SECRET: "ci-0123456789abcdef0123456789abcdef"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,fast,metrics,redis]" "${{ matrix.litellm }}"  # redis: e2e işletim yığını (erişilemeyen Redis senaryosu)
      - run: ruff check matriks_pii scripts tests
      - run: mypy matriks_pii --ignore-missing-imports
      - run: pytest -q
      - run: python scripts/corpus_report.py
      - run: python -m matriks_pii.selftest --config examples/config.yaml
      - run: python -m matriks_pii.selftest --config examples/config.strict.yaml
      - run: pytest -q -m benchmark
        env:
          # Paylaşımlı GitHub runner'ları arasında hız 3-4 kat değişebiliyor (bir runner'da 2 KB p50 = 10 ms ölçüldü);
          # CI eşiği yalnız ciddi gerilemeyi (ör. doğrusal olmayan karmaşıklık) yakalamak içindir (yerel varsayılan: 3).
          MATRIKS_PII_BENCH_TOL: "6"
      - run: pytest -q -m e2e tests/e2e
        if: matrix.os == 'ubuntu-latest'
      - run: python scripts/build_org_names.py --check
      - name: dış veri setleri (Werea-KVKK-Bench, turkish-pii-masking-benchmark)
        run: python scripts/external_bench.py --download && pytest -q -m external
        continue-on-error: true  # HF erişimi yoksa ana iş kırmızı olmasın

  redis-live:
    # gerçek redis-py + Redis sunucusu ile depo testleri (FakeRedis dışında)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      PYTHONUTF8: "1"
      MATRIKS_PII_REDIS_URL: "redis://localhost:6379/0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,redis]"
      - run: pytest -q -m redis_live tests/test_store_live.py

  wheel:
    # paket verisinin (sözlükler, özel kategori terimleri) wheel'e girdiğini kanıtlar
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: pip install dist/*.whl "litellm[proxy]==1.106.5" pytest pytest-asyncio pyyaml
      - run: cd /tmp && python -c "import matriks_pii, matriks_pii.data as d; assert len(d.first_names()) > 5000 and len(d.special_terms()) > 300; print(matriks_pii.__version__)"
      - run: cd /tmp && python -m matriks_pii.selftest --config $GITHUB_WORKSPACE/examples/config.yaml --quick

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip install -e ".[redis,fast,metrics]" "litellm[proxy]==1.106.5"
      - run: pip-audit --progress-spinner off
        continue-on-error: true  # bulgular raporlanır; üçüncü taraf açıkları ana işi kırmasın

  ner:
    runs-on: ubuntu-latest
    continue-on-error: true  # model indirme (HF) ağa bağlı
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,ner]" --extra-index-url https://download.pytorch.org/whl/cpu
      - run: pytest -q -m ner
